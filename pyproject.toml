[project]
name = "asistente-citas-shiny"
version = "0.1.0"
description = "Chatbot en español para agendar citas, con Shiny para Python y la API de Gemini"
requires-python = ">=3.11"
dependencies = [
    "shiny>=1.4",
    "python-dotenv>=1.0",
    "google-genai>=2.28.0",
    "shinychat>=0.7.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
